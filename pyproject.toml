[project]
name = "assignment-03-mlops-agent"
version = "0.1.0"
description = "Production-ready MLOps AI agent integrating DVC, MLflow, Airflow 3 and Kubernetes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.uv]
# Not a distributable library: modules (agent, api, training, dags) run from the repo root.
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["infra/airflow-logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs live services (MLflow/Airflow/Kubernetes); skipped in CI",
]
