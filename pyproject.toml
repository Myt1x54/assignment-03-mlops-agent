[project]
name = "assignment-03-mlops-agent"
version = "0.1.0"
description = "Production-ready MLOps AI agent integrating DVC, MLflow, Airflow 3 and Kubernetes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.162.6",
    "google-genai>=3.3.0",
    "joblib>=1.6.0",
    "kubernetes>=37.0.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx",
]

[tool.uv]
# Not a distributable library: modules (agent, api, training, dags) run from the repo root.
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["infra/airflow-logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
filterwarnings = [
    "ignore::SyntaxWarning",  # emitted by google-genai's generated types module, not our code
]
markers = [
    "integration: needs live services (MLflow/Airflow/Kubernetes); skipped in CI",
]
